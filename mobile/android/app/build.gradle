apply plugin: 'com.android.application'

// The release signing identity, read from ../../keystore.properties (which is
// chmod 600 and gitignored — see mobile/README.md). ABSENT ON A FRESH CLONE, and
// that is the point: `assembleDebug` must work for anyone who checks this out,
// so the release signingConfig is only declared when the file that would fill it
// in actually exists. Without it, `assembleRelease` produces an unsigned APK and
// says so, rather than failing with a null-pointer three tasks deep.
def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "dev.vellum.mobile"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.vellum.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Kept in step with mobile/package.json, which is kept in step with the
        // repo root. The shell and the server it fronts ship as one product.
        versionCode 10701
        versionName "1.7.1"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file("../" + keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']

                // v1 (JAR signing) is for API 23 and below and this app's floor
                // is 24, so it is only weight and a slower install. v3 carries
                // the key-rotation lineage: it costs nothing today and is the
                // only thing that makes rotating this key possible later
                // without every installed copy refusing the update.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            // Left off deliberately. The only Java in this APK is three small
            // classes, and Capacitor's plugin loading is reflective: shrinking
            // buys a few kB and costs a class of failure that only appears in
            // the release build, on someone else's phone. The template's empty
            // proguard-rules.pro went with it — a rules file that is never read
            // is a file someone will one day edit and wonder why nothing
            // happened.
            minifyEnabled false
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
